<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGPU Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

    #canvas-container {
      position: fixed; inset: 0;
    }
    canvas { width: 100%; height: 100%; display: block; }

    /* Drop overlay */
    #drop-overlay {
      position: fixed; inset: 0; background: rgba(10,10,10,0.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.2s;
    }
    #drop-overlay.active { opacity: 1; pointer-events: all; }
    #drop-overlay svg { width: 80px; height: 80px; stroke: #7c8cf8; fill: none; stroke-width: 1.5; }
    #drop-overlay p { margin-top: 16px; font-size: 1.2rem; color: #7c8cf8; }

    /* Welcome screen */
    #welcome {
      position: fixed; inset: 0; background: rgba(10,10,10,0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 50; transition: opacity 0.4s;
    }
    #welcome h1 { font-size: 2rem; font-weight: 300; letter-spacing: 0.1em; color: #fff; }
    #welcome p { margin-top: 8px; color: #888; font-size: 0.9rem; }
    #welcome .hint { margin-top: 32px; color: #555; font-size: 0.8rem; }
    #load-btn {
      margin-top: 20px; padding: 10px 24px; background: #7c8cf8; color: #fff;
      border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer;
      transition: background 0.2s;
    }
    #load-btn:hover { background: #5c6cf8; }

    /* Side panel */
    #panel {
      position: fixed; top: 0; right: 0; width: 280px; height: 100%;
      background: rgba(15,15,20,0.92); backdrop-filter: blur(10px);
      border-left: 1px solid rgba(255,255,255,0.06);
      overflow-y: auto; padding: 16px; transform: translateX(100%);
      transition: transform 0.3s; z-index: 20;
    }
    #panel.open { transform: translateX(0); }

    .panel-section { margin-bottom: 20px; }
    .panel-section h3 {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em;
      color: #666; margin-bottom: 10px; padding-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .row label { font-size: 0.78rem; color: #999; min-width: 80px; }
    .row input[type=range] { flex: 1; accent-color: #7c8cf8; }
    .row input[type=number] { width: 52px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: #e0e0e0; padding: 2px 6px; font-size: 0.78rem; }
    .row input[type=color] { width: 32px; height: 24px; border: none; background: none; cursor: pointer; }
    .row span.val { font-size: 0.78rem; color: #7c8cf8; min-width: 30px; text-align: right; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em;
    }
    .badge.on { background: rgba(124,140,248,0.2); color: #7c8cf8; }
    .badge.off { background: rgba(255,255,255,0.05); color: #666; }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    .toggle-row label { font-size: 0.78rem; color: #ccc; }
    .toggle {
      width: 36px; height: 20px; background: rgba(255,255,255,0.1);
      border-radius: 10px; position: relative; cursor: pointer; transition: background 0.2s;
    }
    .toggle.active { background: #7c8cf8; }
    .toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #fff; transition: left 0.2s;
    }
    .toggle.active::after { left: 19px; }

    .select-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .select-row label { font-size: 0.78rem; color: #999; min-width: 80px; }
    .select-row select {
      flex: 1; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px; color: #e0e0e0; padding: 3px 6px; font-size: 0.78rem;
    }

    /* Light items */
    .light-item {
      background: rgba(255,255,255,0.04); border-radius: 6px; padding: 8px 10px;
      margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.06);
    }
    .light-item-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; cursor: pointer; }
    .light-item-header span { font-size: 0.8rem; color: #ccc; flex: 1; }
    .light-item-header .del { color: #f87; cursor: pointer; font-size: 0.9rem; }
    .light-item-body { display: none; }
    .light-item.expanded .light-item-body { display: block; }

    /* Toolbar */
    #toolbar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(15,15,20,0.9); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
      display: flex; gap: 4px; padding: 6px; z-index: 20;
    }
    .tb-btn {
      padding: 6px 14px; border: none; background: transparent;
      color: #888; font-size: 0.78rem; border-radius: 8px; cursor: pointer;
      transition: all 0.15s;
    }
    .tb-btn:hover { background: rgba(255,255,255,0.07); color: #ccc; }
    .tb-btn.active { background: rgba(124,140,248,0.2); color: #7c8cf8; }
    .tb-btn.danger { color: #f87; }

    /* Stats overlay */
    #stats {
      position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,0.5);
      border-radius: 6px; padding: 6px 10px; font-size: 0.72rem; color: #666;
      font-family: monospace; z-index: 10; pointer-events: none;
    }
    #stats span { color: #7c8cf8; }

    #toggle-panel-btn {
      position: fixed; top: 12px; right: 12px; z-index: 30;
      background: rgba(15,15,20,0.85); border: 1px solid rgba(255,255,255,0.08);
      color: #888; border-radius: 8px; padding: 6px 12px; cursor: pointer;
      font-size: 0.78rem; backdrop-filter: blur(6px);
    }

    #photomode-overlay {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(124,140,248,0.15); border: 1px solid rgba(124,140,248,0.3);
      color: #7c8cf8; border-radius: 8px; padding: 6px 16px; font-size: 0.78rem;
      display: none; z-index: 10; pointer-events: none;
    }

    #hdri-btn {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
      background: rgba(15,15,20,0.85); border: 1px solid rgba(255,255,255,0.08);
      color: #888; border-radius: 8px; padding: 6px 14px; cursor: pointer;
      font-size: 0.78rem; backdrop-filter: blur(6px); display: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <div id="drop-overlay">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <p>Drop GLTF / GLB / HDR here</p>
  </div>

  <div id="welcome">
    <h1>WebGPU Viewer</h1>
    <p>PBR · IBL · TAA · SSR · Path Tracing</p>
    <button id="load-btn">Load GLTF / GLB</button>
    <p class="hint">or drag & drop a file anywhere</p>
  </div>

  <div id="stats">
    FPS: <span id="fps">--</span> &nbsp;
    Frame: <span id="frame-time">--</span>ms &nbsp;
    Triangles: <span id="tri-count">--</span>
  </div>

  <button id="toggle-panel-btn">Settings ▸</button>

  <div id="photomode-overlay">📷 Path Tracing — <span id="pt-samples">0</span> samples</div>

  <div id="panel">
    <div class="panel-section">
      <h3>Render Mode</h3>
      <div class="select-row">
        <label>Mode</label>
        <select id="render-mode">
          <option value="realtime">Real-time PBR</option>
          <option value="pathtrace">Photo (Path Trace)</option>
        </select>
      </div>
    </div>

    <div class="panel-section">
      <h3>Post Processing</h3>
      <div class="toggle-row">
        <label>TAA</label>
        <div class="toggle active" data-toggle="taa"></div>
      </div>
      <div class="toggle-row">
        <label>SSR</label>
        <div class="toggle active" data-toggle="ssr"></div>
      </div>
      <div class="toggle-row">
        <label>Contact Shadows</label>
        <div class="toggle active" data-toggle="contactShadows"></div>
      </div>
      <div class="toggle-row">
        <label>Bloom</label>
        <div class="toggle" data-toggle="bloom"></div>
      </div>
      <div class="toggle-row">
        <label>SSAO</label>
        <div class="toggle active" data-toggle="ssao"></div>
      </div>
      <div class="row">
        <label>Exposure</label>
        <input type="range" id="exposure" min="-3" max="3" step="0.1" value="0" />
        <span class="val" id="exposure-val">0</span>
      </div>
      <div class="select-row">
        <label>Tonemap</label>
        <select id="tonemap-mode">
          <option value="agx">AgX</option>
          <option value="aces">ACES</option>
          <option value="filmic">Filmic</option>
          <option value="linear">Linear</option>
        </select>
      </div>
    </div>

    <div class="panel-section">
      <h3>Environment</h3>
      <div class="row">
        <label>IBL Intensity</label>
        <input type="range" id="ibl-intensity" min="0" max="5" step="0.1" value="1" />
        <span class="val" id="ibl-val">1</span>
      </div>
      <div class="toggle-row">
        <label>Show Skybox</label>
        <div class="toggle active" data-toggle="skybox"></div>
      </div>
      <button id="load-hdri-btn" class="tb-btn" style="width:100%;margin-top:4px;">Load HDRI (.hdr)</button>
    </div>

    <div class="panel-section">
      <h3>Lights</h3>
      <div id="lights-list"></div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="tb-btn" id="add-point" style="flex:1;">+ Point</button>
        <button class="tb-btn" id="add-dir" style="flex:1;">+ Directional</button>
      </div>
    </div>

    <div class="panel-section">
      <h3>Camera</h3>
      <div class="row">
        <label>FOV</label>
        <input type="range" id="fov" min="20" max="120" step="1" value="60" />
        <span class="val" id="fov-val">60°</span>
      </div>
      <div class="row">
        <label>Near</label>
        <input type="number" id="near" value="0.01" step="0.001" min="0.001" />
      </div>
      <div class="row">
        <label>Far</label>
        <input type="number" id="far" value="1000" step="1" min="1" />
      </div>
    </div>

    <div class="panel-section">
      <h3>Scene</h3>
      <button class="tb-btn" id="reset-camera" style="width:100%">Reset Camera</button>
      <button class="tb-btn" id="fit-camera" style="width:100%;margin-top:4px;">Fit to Model</button>
    </div>
  </div>

  <div id="toolbar">
    <button class="tb-btn active" id="tb-realtime">Real-time</button>
    <button class="tb-btn" id="tb-photo">📷 Photo</button>
    <button class="tb-btn" id="tb-load">Open Model</button>
    <button class="tb-btn" id="tb-hdri">HDRI</button>
    <button class="tb-btn" id="tb-screenshot">Screenshot</button>
  </div>

  <input type="file" id="file-input" accept=".gltf,.glb,.bin,.png,.jpg,.jpeg,.webp" multiple style="display:none" />
  <input type="file" id="hdri-input" accept=".hdr" style="display:none" />

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
